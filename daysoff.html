<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>West Center - Days Off Board</title>
    
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --accent: #ffcc00;
            --accent-green: #2ecc71;
            --accent-red: #ff3333;
            --border: #333;
            --text-main: #ffffff;
            --text-muted: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; padding-top: 100px; }

        /* HEADER & NAVIGATION */
        .top-navbar {
            position: fixed; top: 0; left: 0; right: 0; min-height: 75px;
            background: #1a1a1a; border-bottom: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            flex-wrap: wrap; gap: 15px;
        }
        .header-title { font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }
        .header-sub { font-size: 13px; color: var(--accent); margin-top: 2px; font-weight: 500; }
        
        .hamburger-btn {
            background: none; border: none; color: var(--accent); 
            font-size: 28px; cursor: pointer; transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
        }
        .hamburger-btn:active { transform: scale(0.9); }

        .main-nav-drawer {
            position: fixed; top: 0; left: 0; bottom: 0; width: 300px;
            background: #161616; border-right: 2px solid var(--accent);
            z-index: 3000; transform: translateX(-100%); transition: transform 0.3s ease;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column;
        }
        .main-nav-drawer.open { transform: translateX(0); }
        .nav-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 2500; display: none;
            backdrop-filter: blur(2px);
        }
        .nav-overlay.open { display: block; }
        
        .nav-section-title { padding: 25px 20px 8px; font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px dashed #333; margin-bottom: 5px; }
        .nav-item {
            display: block; padding: 12px 20px; color: #e0e0e0; text-decoration: none;
            font-size: 14px; transition: all 0.2s; font-weight: 500; border-left: 4px solid transparent;
        }
        .nav-item:hover { background: #222; color: white; padding-left: 25px; border-left-color: #555; }
        .nav-item.active { background: #2a2a2a; border-left-color: var(--accent); color: var(--accent); font-weight: bold; pointer-events: none; }

        /* LOADING OVERLAY */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-main); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .parsing-text { color: var(--text-muted); font-weight: bold; font-size: 16px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* BOARD SPECIFIC STYLING */
        .zone-header {
            background: #222; padding: 12px; margin: 30px 0 15px 0; border-radius: 6px;
            border-left: 4px solid var(--accent); font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            position: sticky; top: 75px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .driver-row {
            background-color: var(--bg-card); border: 1px solid var(--border);
            border-radius: 6px; padding: 12px 16px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; transition: all 0.2s;
        }
        
        /* The gold highlight class */
        .driver-row.highlight {
            border-color: var(--accent);
            background-color: #2a2615;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }
        
        .driver-info { display: flex; flex-direction: column; min-width: 150px; }
        .driver-name { font-size: 16px; font-weight: bold; color: white; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-board {
            padding: 8px 16px; border: none; border-radius: 4px; font-size: 12px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; box-shadow: 0 3px 0 #000;
        }
        .btn-board:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
        .btn-off { background-color: var(--accent-green); color: #111; }
        .btn-stay { background-color: #444; color: #fff; border: 1px solid #666; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="parsing-text">↻ Loading Live Board...</div>
    </div>

    <div id="nav-overlay" class="nav-overlay" onclick="closeNavMenu()"></div>
    <div id="main-nav-menu" class="main-nav-drawer">
        <div class="drawer-header" style="border-bottom: none; padding: 20px; padding-bottom: 10px; display: flex; justify-content: space-between;">
            <h3 style="color: white; font-size: 18px;">Driver Portal Menu</h3>
            <button onclick="closeNavMenu()" style="background: transparent; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer;">✕</button>
        </div>
        <div id="nav-links-container"></div>
    </div>

    <div class="top-navbar">
        <div style="display: flex; align-items: center; gap: 15px; flex: 1;">
            <button class="hamburger-btn" onclick="openNavMenu()">☰</button>
            <div>
                <div class="header-title">West Center - Dispatch Board</div>
                <div id="driver-info" class="header-sub">Live Days Off Tracker</div>
            </div>
        </div>
    </div>

    <div id="board-container" style="max-width: 800px; margin: 0 auto;">
        <div class="zone-header">Bid Drivers (Round 1)</div>
        <div id="zone-1-list"></div>

        <div class="zone-header">Bid Drivers (Round 2)</div>
        <div id="zone-2-list"></div>

        <div class="zone-header">Coverage Drivers</div>
        <div id="zone-3-list"></div>
    </div>

    <script>
        // 1. Security & Auth
        const urlParams = new URLSearchParams(window.location.search);
        let memberGuid = urlParams.get('id') || localStorage.getItem('saved_member_token');
        if (memberGuid) localStorage.setItem('saved_member_token', memberGuid);

        let activeDispatcher = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : "Unknown User";

        // Grab the 'hub' from the URL (Default to West if missing)
        let rawCenter = urlParams.get('hub') || 'West';

        // Mathematically forces "EAST" into "East" and "WEST" into "West"
        let currentCenter = rawCenter.charAt(0).toUpperCase() + rawCenter.slice(1).toLowerCase(); 

        // Dynamically update the page headers
        document.title = `${currentCenter} Center - Days Off Board`;
        document.querySelector('.header-title').innerText = `${currentCenter} Center (Monday - Friday)`;
                
        // 2. The Power Automate Endpoint
        const flowUrl = "https://defaultb1b2f01d8fee4ceb9550ca64ce62b7.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4f15a4289d7747779ba892ae2de71ada/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=9Y8bdwj3XSpksiWuyAdq_EbccltWFNebIwQdkhSzFLc";
        
        // Menu Controllers
        function openNavMenu() {
            document.getElementById('main-nav-menu').classList.add('open');
            document.getElementById('nav-overlay').classList.add('open');
        }
        function closeNavMenu() {
            document.getElementById('main-nav-menu').classList.remove('open');
            document.getElementById('nav-overlay').classList.remove('open');
        }

        // Menu Builder
        function buildNavigation() {
            let secureQueryString = `?center=${currentCenter}`;
            if (memberGuid) secureQueryString += `&id=${memberGuid}`;
            if (urlParams.get('name')) secureQueryString += `&name=${urlParams.get('name')}`;

            fetch('member-nav.json', { cache: 'no-store' })
                .then(response => response.json())
                .then(menuItems => {
                    const navContainer = document.getElementById('nav-links-container');
                    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
                    let menuHTML = '';

                    menuItems.forEach(item => {
                        if (item.type === 'header') {
                            menuHTML += `<div class="nav-section-title" style="margin-top: 10px;">${item.title}</div>`;
                        } else if (item.type === 'link') {
                            const isActive = (currentPage === item.filename) ? 'active' : '';
                            const finalUrl = item.filename + secureQueryString;
                            menuHTML += `<a href="${finalUrl}" class="nav-item ${isActive}">${item.name}</a>`;
                        }
                    });
                    navContainer.innerHTML = menuHTML;
                })
                .catch(err => console.log("Menu Error:", err));
        }

                // The Universal Click Action (Now passing Date AND Group)
        function stampDriver(driverName, status, zone, group) {
            event.target.innerText = "...";
            
            // 1. Generate today's date
            const d = new Date();
            const todayStr = ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + '/' + d.getFullYear();

            // 2. Build the complete payload
            const payload = { 
                "DriverName": driverName, 
                "NewStatus": status, 
                "Timestamp": todayStr,      // <-- Date safely added back
                "Zone": parseInt(zone), 
                "Center": currentCenter, 
                "Route": currentCenter + "Post", 
                "UpdatedBy": activeDispatcher, 
                "Group": group              // <-- Group safely passed
            };

            // 3. Send to Power Automate
            fetch(flowUrl, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(payload) 
            })
            .then(res => { if(res.ok) setTimeout(() => { loadBoardData(); }, 1500); })
            .catch(err => alert("Error saving to database."));
        }


        // --- GLOBAL ROTATION MATH (ONE BIG LIST) ---
        function calculateGlobalHighlight(bidList, coverList) {
            // 1. Stack them exactly how they appear on the screen
            let virtualBoard = [];
            bidList.forEach(d => virtualBoard.push({ ...d, expectedZone: 1 }));
            bidList.forEach(d => virtualBoard.push({ ...d, expectedZone: 2 }));
            coverList.forEach(d => virtualBoard.push({ ...d, expectedZone: 3 }));

            // 2. Find the most recent date clicked across the ENTIRE board
            let mostRecentTime = 0; let mostRecentDateStr = "";
            virtualBoard.forEach(d => {
                if (d.ZoneTag == d.expectedZone && d.Timestamp) {
                    let ts = new Date(d.Timestamp).getTime();
                    if (ts > mostRecentTime) { mostRecentTime = ts; mostRecentDateStr = d.Timestamp; }
                }
            });
            if (mostRecentDateStr === "") return 0; // Board is empty, highlight top guy

            // 3. Find furthest person down the global list who got OFF
            let lastOffIndex = -1; let firstStayAfterOff = -1;
            virtualBoard.forEach((d, i) => {
                if (d.ZoneTag == d.expectedZone && d.Timestamp === mostRecentDateStr && d.CurrentStatus && d.CurrentStatus.toLowerCase() === 'off') lastOffIndex = i;
            });
            
            // 4. Check for any forced STAYS after that person
            let startIndex = lastOffIndex === -1 ? 0 : lastOffIndex + 1;
            for (let i = startIndex; i < virtualBoard.length; i++) {
                if (virtualBoard[i].ZoneTag == virtualBoard[i].expectedZone && virtualBoard[i].Timestamp === mostRecentDateStr && virtualBoard[i].CurrentStatus && virtualBoard[i].CurrentStatus.toLowerCase() === 'stay') {
                    firstStayAfterOff = i; break; 
                }
            }

            if (firstStayAfterOff !== -1) return firstStayAfterOff;
            else if (lastOffIndex !== -1) return (lastOffIndex + 1) % virtualBoard.length;
            else return 0; 
        }

        // Rendering the Rows
        function buildRowHtml(driver, zoneContext, isHighlighted = false) {
            let displayStatus = "PENDING";
            let statusColor = "var(--text-muted)"; 
            
            const d = new Date();
            const todayStr = ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + '/' + d.getFullYear();
            
            const isToday = (driver.Timestamp === todayStr);
            const isRecentPast = (driver.Timestamp === window.recentPastDay);

            const updaterName = driver.UpdatedBy || driver.Updated_x0020_By || driver['Updated By'] || "";

            if (driver.ZoneTag == zoneContext && driver.CurrentStatus) {
                displayStatus = `${driver.CurrentStatus} (${driver.Timestamp})`;
                
                if (driver.CurrentStatus.toLowerCase() === 'off') {
                    if (isToday) {
                        statusColor = "var(--accent-green)"; 
                    } else if (isRecentPast) {
                        statusColor = "var(--accent)"; 
                    } else {
                        statusColor = "var(--text-muted)"; 
                    }
                } else {
                    statusColor = "var(--accent-red)"; 
                }
            }

            let auditTrailHtml = "";
            if (updaterName && driver.CurrentStatus) {
                auditTrailHtml = `<span style="font-size: 10px; color: #555; margin-top: 3px; font-style: italic;">Clicked by: ${updaterName}</span>`;
            }

            let actionButton = "";
            if (isToday && driver.CurrentStatus === 'Off' && driver.ZoneTag == zoneContext) {
                actionButton = `<button class="btn-board btn-stay" onclick="stampDriver('${driver.Title}', 'Stay', ${zoneContext}, '${driver.Group}')">REVOKE</button>`;
            } else {
                actionButton = `<button class="btn-board btn-off" onclick="stampDriver('${driver.Title}', 'Off', ${zoneContext}, '${driver.Group}')">OFF</button>`;
            }

            let rowClass = isHighlighted ? "driver-row highlight" : "driver-row";

            return `
                <div class="${rowClass}">
                    <div class="driver-info">
                        <span class="driver-name">${driver.Title}</span>
                        <span class="driver-status" style="color: ${statusColor}; font-weight: bold; font-size: 12px; margin-top: 4px; text-transform: uppercase;">${displayStatus}</span>
                        ${auditTrailHtml}
                    </div>
                    <div class="action-btns">
                        ${actionButton}
                    </div>
                </div>
            `;
        }

                // Fetching and Displaying the Data
        function loadBoardData() {
            fetch(flowUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ "Route": currentCenter + "Get" })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading-overlay').style.display = 'none';

                const d = new Date();
                const todayStr = ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + '/' + d.getFullYear();
                
                let pastDates = [...new Set(data.map(d => d.Timestamp).filter(ts => ts && ts !== todayStr))];
                pastDates.sort((a, b) => new Date(b) - new Date(a));
                
                window.recentPastDay = pastDates[0] || null; 

                const bidDrivers = data.filter(d => d.Group === 'Bid');
                const coverDrivers = data.filter(d => d.Group === 'Coverage');

                // --- Calculate the single GLOBAL highlight winner ---
                const globalHighlightIndex = calculateGlobalHighlight(bidDrivers, coverDrivers);
                let runningIndex = 0;

                // Draw Zone 1 (Round 1)
                document.getElementById('zone-1-list').innerHTML = bidDrivers.map(d => {
                    let isWinner = (runningIndex === globalHighlightIndex); runningIndex++;
                    return buildRowHtml(d, 1, isWinner);
                }).join('');

                // Draw Zone 2 (Round 2)
                document.getElementById('zone-2-list').innerHTML = bidDrivers.map(d => {
                    let isWinner = (runningIndex === globalHighlightIndex); runningIndex++;
                    return buildRowHtml(d, 2, isWinner);
                }).join('');

                // Draw Zone 3 (Coverage)
                document.getElementById('zone-3-list').innerHTML = coverDrivers.map(d => {
                    let isWinner = (runningIndex === globalHighlightIndex); runningIndex++;
                    return buildRowHtml(d, 3, isWinner);
                }).join('');

                // --- NEW: Auto-Scroll to the Highlight ---
                setTimeout(() => {
                    const activeRow = document.querySelector('.driver-row.highlight');
                    if (activeRow) {
                        activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100); // 100ms delay gives the browser time to paint the rows on the screen first

            })
            .catch(error => {
                document.getElementById('loading-overlay').innerHTML = `<div style="color:red; font-weight:bold;">Error loading board data.</div>`;
                console.error("Fetch error:", error);
            });
        }


        // Initialize Page
        buildNavigation();
        loadBoardData();
    </script>
</body>
</html>
