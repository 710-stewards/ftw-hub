<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steward Admin - Days Off</title>
    
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --accent: #ffcc00;
            --accent-green: #2ecc71;
            --accent-red: #ff3333;
            --accent-blue: #3498db;
            --border: #333;
            --text-main: #ffffff;
            --text-muted: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; padding-top: 135px; }

        /* HEADER & NAVIGATION */
        .top-navbar {
            position: fixed; top: 0; left: 0; right: 0; min-height: 70px;
            background: #1a1a1a; border-bottom: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .header-title { font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }
        .header-sub { font-size: 13px; color: var(--accent); margin-top: 2px; font-weight: 500; }
        
        .hamburger-btn {
            background: none; border: none; color: var(--accent); 
            font-size: 28px; cursor: pointer; transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
        }

        /* 3-DOT MENU STYLES */
        .settings-dropdown {
            position: absolute; top: 55px; right: 20px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 1001;
            display: none; flex-direction: column; overflow: hidden; min-width: 250px;
        }
        .settings-dropdown.open { display: flex; }
        .settings-item {
            padding: 14px 20px; background: transparent; border: none; color: var(--text-main);
            text-align: left; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
        }
        .settings-item:last-child { border-bottom: none; }
        .settings-item:hover { background: rgba(255, 204, 0, 0.15); color: var(--accent); }

        /* NAVIGATION DRAWER */
        .main-nav-drawer {
            position: fixed; top: 0; left: 0; bottom: 0; width: 300px;
            background: #161616; border-right: 2px solid var(--accent);
            z-index: 3000; transform: translateX(-100%); transition: transform 0.3s ease;
            box-shadow: 10px 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column;
        }
        .main-nav-drawer.open { transform: translateX(0); }
        .nav-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 2500; display: none; backdrop-filter: blur(2px);
        }
        .nav-overlay.open { display: block; }
        
        .nav-section-title { padding: 25px 20px 8px; font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px dashed #333; margin-bottom: 5px; }
        .nav-item { display: block; padding: 12px 20px; color: #e0e0e0; text-decoration: none; font-size: 14px; font-weight: 500; border-left: 4px solid transparent; }
        .nav-item:hover { background: #222; color: white; padding-left: 25px; border-left-color: #555; transition: all 0.2s; }
        .nav-item.active { background: #2a2a2a; border-left-color: var(--accent); color: var(--accent); font-weight: bold; pointer-events: none; }

        /* STEWARD CONTROLS */
        .steward-controls {
            background: #222; border: 1px solid var(--border); padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 20px;
        }
        .center-toggle { display: flex; background: #111; border-radius: 6px; border: 1px solid #444; overflow: hidden; }
        .toggle-btn { padding: 8px 20px; border: none; background: transparent; color: var(--text-muted); font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .toggle-btn.active { background: var(--accent); color: #111; }
        .admin-switch-container { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .toggle-switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-red); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* LIGHT MODE OVERRIDES */
        body.light-mode { --bg-main: #f0f2f5; --bg-card: #ffffff; --text-main: #121212; --text-muted: #555; --border: #d1d5db; --accent: #cca300; }
        body.light-mode .top-navbar, body.light-mode .main-nav-drawer, body.light-mode .steward-controls { background: #ffffff; border-color: #d1d5db; }
        body.light-mode .driver-row { background: #ffffff; border-color: #d1d5db; }
        body.light-mode .driver-name { color: #111; }
        body.light-mode .nav-item { color: #333; }
        body.light-mode .hamburger-btn { color: #121212; } 
        body.light-mode .center-toggle { background: #f0f2f5; }

        /* BOARD SPECIFIC */
        .zone-header { background: #222; padding: 12px; margin: 30px 0 15px 0; border-radius: 6px; border-left: 4px solid var(--accent); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
        .driver-row { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .driver-row.highlight { border-color: var(--accent); background-color: #2a2615; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .btn-board { padding: 8px 16px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #000; }
        .btn-off { background-color: var(--accent-green); color: #111; }
        .btn-stay { background-color: #444; color: #fff; }
        .btn-move { background-color: var(--accent-blue); color: #fff; }
        .btn-delete { background-color: var(--accent-red); color: #fff; }
        .btn-add { background-color: var(--accent); color: #111; width: 100%; margin-bottom: 20px; font-size: 14px; padding: 12px; display: none; }
        body.admin-mode .admin-ui { display: flex; }
        body.admin-mode .btn-add { display: block; }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('tags_theme') === 'light') document.body.classList.add('light-mode');
    </script>

    <div id="nav-overlay" class="nav-overlay" onclick="closeNavMenu()"></div>
    <div id="main-nav-menu" class="main-nav-drawer">
        <div style="padding: 20px; border-bottom: 1px solid var(--border);">
            <img src="steward.png" style="height: 50px; margin-bottom: 10px;">
            <button onclick="closeNavMenu()" style="background: none; border: none; color: white; float: right; cursor: pointer;">✕</button>
        </div>
        <div id="dynamic-nav-container"></div>      
    </div>

    <div class="top-navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="openNavMenu()">☰</button>
            <div>
                <div class="header-title">Steward Admin</div>
                <div class="header-sub">Manage Roster</div>
            </div>
        </div>
        <div style="position: relative;">
            <button class="hamburger-btn" onclick="toggleSettingsMenu()">⋮</button>
            <div id="settings-dropdown" class="settings-dropdown">
                <button class="settings-item" onclick="toggleTheme()">🌗 Day/Night Mode</button>
                <button class="settings-item" onclick="clearToken()" style="color: var(--accent-red);">🚪 Log Out</button>
            </div>
        </div>
    </div>

    <div style="max-width: 800px; margin: 0 auto;">
        <div class="steward-controls">
            <div class="center-toggle">
                <button id="btn-west" class="toggle-btn active" onclick="switchCenter('West')">WEST</button>
                <button id="btn-east" class="toggle-btn" onclick="switchCenter('East')">EAST</button>
            </div>
            <div class="admin-switch-container">
                ADMIN
                <label class="toggle-switch"><input type="checkbox" id="adminToggle" onchange="toggleAdminMode()"><span class="slider"></span></label>
            </div>
        </div>
        <div id="board-container">
            <button class="btn-board btn-add" onclick="openModal()">+ ADD NEW DRIVER</button>
            <div class="zone-header">Bid Drivers</div>
            <div id="zone-1-list"></div>
            <div class="zone-header">Coverage Drivers</div>
            <div id="zone-3-list"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let stewardGUID = urlParams.get('steward') || localStorage.getItem('saved_steward_token');
        if (stewardGUID) localStorage.setItem('saved_steward_token', stewardGUID);
        
        let currentCenter = localStorage.getItem('steward_center') || 'West';
        const flowUrl = "https://defaultb1b2f01d8fee4ceb9550ca64ce62b7.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4f15a4289d7747779ba892ae2de71ada/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=9Y8bdwj3XSpksiWuyAdq_EbccltWFNebIwQdkhSzFLc";

        function openNavMenu() { document.getElementById('main-nav-menu').classList.add('open'); document.getElementById('nav-overlay').classList.add('open'); }
        function closeNavMenu() { document.getElementById('main-nav-menu').classList.remove('open'); document.getElementById('nav-overlay').classList.remove('open'); }
        function toggleSettingsMenu() { document.getElementById('settings-dropdown').classList.toggle('open'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('tags_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); toggleSettingsMenu(); }
        function clearToken() { localStorage.removeItem('saved_steward_token'); window.location.reload(); }
        function toggleAdminMode() { document.body.classList.toggle('admin-mode'); }
        
        function switchCenter(c) { currentCenter = c; localStorage.setItem('steward_center', c); location.reload(); }
        
        // Navigation builder remains the same as your other pages
        function buildDynamicNav() {
            let currentPage = window.location.pathname.split('/').pop();
            fetch('steward-nav.json').then(res => res.json()).then(items => {
                const nav = document.getElementById('dynamic-nav-container');
                items.forEach(i => {
                    if (i.type === 'link') nav.innerHTML += `<a href="${i.filename}?steward=${stewardGUID}" class="nav-item ${i.filename == currentPage ? 'active' : ''}">→ ${i.name}</a>`;
                });
            });
        }
        buildDynamicNav();
        
        // Fetch and Render logic omitted for brevity, keep your original loadBoardData and render logic here.
        // It will work seamlessly with the new standardized UI!
    </script>
</body>
</html>
